name: pypi

# Orkline on PyPI as `orkline` (docs/distribution-howto.md). Every push builds the wheel and the sdist and
# checks them (a dry run: nothing leaves CI). A release tag (v<__version__>) also publishes them, through
# PyPI's trusted publishing: PyPI trusts this workflow in the `pypi` environment, so no token is stored anywhere.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Name it orkline (this checkout only; from git it stays orkcraft)
        run: python tools/pypi.py rename
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: What it carries
        run: python tools/pypi.py check dist ${{ startsWith(github.ref, 'refs/tags/v') && format('--tag {0}', github.ref_name) || '' }}
      - name: Both commands run from the wheel
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/pip install dist/*.whl
          /tmp/try/bin/orkline --version
          /tmp/try/bin/orkcraft --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/orkline
    permissions:
      id-token: write                # trusted publishing: PyPI swaps this run's identity for a short-lived token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
