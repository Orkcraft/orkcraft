name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:                       # a new push to a PR cancels its older run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the oldest Python orkcraft supports
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -n auto

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,browser]"
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: The GUI in Chromium
        run: python -m pytest -q -m browser

  installer:                       # install.sh from scratch, with this commit's code (docs/install.md)
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: ORKCRAFT_INSTALL_FROM=. sh install.sh --no-report
      - name: It runs
        run: |
          ~/.local/bin/orkcraft --version
          ~/.local/bin/orkcraft usage status
      - name: The log
        if: always()
        run: cat ~/.orkcraft/install.log
