name: live

# Real tools on real models (tests/live/, docs/testing.md): a new release of a tool that prints
# otherwise shows here, not in a person's town. It costs money, so it never runs on a pull request.
on:
  schedule:
    - cron: "17 3 * * *"           # nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  pi-gemini:
    name: pi on Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ORKCRAFT_LIVE_BUDGET: "0.25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent
          pi --version
      - name: The live bench
        run: python -m pytest -q -m live --live -rs tests/live
