[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orkcraft"
dynamic = ["version"]          # orkcraft/__init__.py __version__: the one place it is raised
description = "A harness for running many coding agents in one project, as a real-time strategy game"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vadim Sidoryk" }]
keywords = ["agents", "claude-code", "orchestration", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development",
]
dependencies = [
    "pyte>=0.8",                 # the Terminals' screens (core/sessions.py)
    "jsonschema>=4.18",
    "markdown-it-py>=3.0",       # the GUI renders Markdown
    "websockets>=13.0",          # the GUI's server: the town is always drawn by it
    "segno>=1.5",                # the QR code a phone pairs with (gui/phones.py): pure Python, never left out
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-xdist>=3", "websockets>=13.0", "cryptography>=41", "segno>=1.5",
       "icalendar>=6.0", "recurring-ical-events>=3.3"]
browser = ["playwright>=1.45"]              # the Catapult's browser mode
# the Calendar reads every repeat, moved occurrence and time zone of a .ics as RFC 5545 says (sources/ics.py)
calendar = ["icalendar>=6.0", "recurring-ical-events>=3.3"]
# the window of its own (without it the town opens in the browser); a phone's TLS certificate and the QR code
# that pairs it (gui/phones.py)
gui = ["pywebview>=5.0", "websockets>=13.0", "cryptography>=41", "segno>=1.5"]

[project.urls]
Homepage = "https://github.com/Orkcraft/orkcraft"
Issues = "https://github.com/Orkcraft/orkcraft/issues"

[project.scripts]
orkcraft = "orkcraft.cli:main"

[tool.setuptools.dynamic]
version = { attr = "orkcraft.__version__" }

[tool.setuptools.packages.find]
include = ["orkcraft*"]

[tool.setuptools.package-data]
# design/system links to design-system/: a wheel carries the files themselves.
orkcraft = ["schemas/*.json", "design/*.json", "design/buildings/*.json", "realm/catapult_mcp/recipes/*.json", "design/system/**/*", "gui/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives the GUI in Chromium (tests/test_gui_browser.py); skipped without Playwright or Chromium"]
