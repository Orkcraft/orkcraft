<!doctype html>
<html><head><meta charset="utf-8"><title>Button</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>html,body{margin:0;height:100%} body{background:#000}</style></head>
<body>
<div class="ok-split">
<section class="ok-stage" data-theme="camp"><span class="ok-mode">Camp · forest</span>
<div class="ok-row">
  <button class="ok-btn primary">Draft the blueprint <span class="ok-kbd">Ctrl+S</span></button>
  <button class="ok-btn">Use the form</button>
  <button class="ok-btn is-focus">Cancel</button>
</div>
<div class="ok-row">
  <button class="ok-btn"><i class="ok-ico">🏗️</i>Build</button>
  <button class="ok-btn is-pressed">Pressed</button>
  <button class="ok-btn danger"><i class="ok-ico">💥</i>Demolish</button>
  <button class="ok-btn" disabled>Disabled</button>
</div>
<div class="ok-row"><button class="ok-act" title="Run"><i class="ok-ico">▶</i><span class="ok-act__label">Run</span></button><button class="ok-act" title="Open in browser"><i class="ok-ico">↗</i><span class="ok-act__label">Open in browser</span></button><button class="ok-act" title="New task"><i class="ok-ico">➕</i><span class="ok-act__label">New task</span></button><button class="ok-act" title="Test"><i class="ok-ico">🧪</i><span class="ok-act__label">Test</span></button></div>
</section>
<section class="ok-stage" data-theme="office"><span class="ok-mode">Office · VS Code</span>
<div class="ok-row">
  <button class="ok-btn primary">Draft the blueprint <span class="ok-kbd">Ctrl+S</span></button>
  <button class="ok-btn">Use the form</button>
  <button class="ok-btn is-focus">Cancel</button>
</div>
<div class="ok-row">
  <button class="ok-btn"><i class="ok-ico">🏗️</i>Build</button>
  <button class="ok-btn is-pressed">Pressed</button>
  <button class="ok-btn danger"><i class="ok-ico">💥</i>Demolish</button>
  <button class="ok-btn" disabled>Disabled</button>
</div>
<div class="ok-row"><button class="ok-act" title="Run"><i class="ok-ico">▶</i><span class="ok-act__label">Run</span></button><button class="ok-act" title="Open in browser"><i class="ok-ico">↗</i><span class="ok-act__label">Open in browser</span></button><button class="ok-act" title="New task"><i class="ok-ico">➕</i><span class="ok-act__label">New task</span></button><button class="ok-act" title="Test"><i class="ok-ico">🧪</i><span class="ok-act__label">Test</span></button></div>
</section>
</div>
</body></html>
