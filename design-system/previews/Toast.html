<!doctype html>
<html><head><meta charset="utf-8"><title>Toast</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>html,body{margin:0;height:100%} body{background:#000}</style></head>
<body>
<div class="ok-split">
<section class="ok-stage" data-theme="camp"><span class="ok-mode">Camp · forest</span>
<div class="ok-toast is-ok"><span class="ok-toast__mark">✓</span><span>Road pit → crossroads laid.</span></div>
<div class="ok-toast is-warn"><span class="ok-toast__mark">⚠</span><span>Spend is at 82% of today's budget.</span></div>
<div class="ok-toast is-error"><span class="ok-toast__mark">✗</span><span>Build failed: a mill step pipes the network into a shell.</span></div>
</section>
<section class="ok-stage" data-theme="office"><span class="ok-mode">Office · VS Code</span>
<div class="ok-toast is-ok"><span class="ok-toast__mark">✓</span><span>Road pit → crossroads laid.</span></div>
<div class="ok-toast is-warn"><span class="ok-toast__mark">⚠</span><span>Spend is at 82% of today's budget.</span></div>
<div class="ok-toast is-error"><span class="ok-toast__mark">✗</span><span>Build failed: a mill step pipes the network into a shell.</span></div>
</section>
</div>
</body></html>
