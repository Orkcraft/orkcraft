<!doctype html>
<html><head><meta charset="utf-8"><title>KeyFooter</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>html,body{margin:0;height:100%} body{background:#000}</style></head>
<body>
<div class="ok-split stack">
<section class="ok-stage" data-theme="camp"><span class="ok-mode">Camp · forest</span>
<div class="ok-keys">
  <span><span class="ok-kbd">Q</span>Quit</span><span><span class="ok-kbd">Space</span>Halt All</span>
  <span><span class="ok-kbd">+</span><span class="ok-ico">Spawn Ork</span><span class="ok-word">Add agent</span></span>
  <span><span class="ok-kbd">!</span><span class="ok-ico">Orders</span><span class="ok-word">Answers</span></span>
  <span><span class="ok-kbd">F10</span>Menu</span><span><span class="ok-kbd">Ctrl+K</span>Palette</span>
</div>
</section>
<section class="ok-stage" data-theme="office"><span class="ok-mode">Office · VS Code</span>
<div class="ok-keys">
  <span><span class="ok-kbd">Q</span>Quit</span><span><span class="ok-kbd">Space</span>Halt All</span>
  <span><span class="ok-kbd">+</span><span class="ok-ico">Spawn Ork</span><span class="ok-word">Add agent</span></span>
  <span><span class="ok-kbd">!</span><span class="ok-ico">Orders</span><span class="ok-word">Answers</span></span>
  <span><span class="ok-kbd">F10</span>Menu</span><span><span class="ok-kbd">Ctrl+K</span>Palette</span>
</div>
</section>
</div>
</body></html>
