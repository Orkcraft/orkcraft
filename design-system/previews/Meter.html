<!doctype html>
<html><head><meta charset="utf-8"><title>Meter</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>html,body{margin:0;height:100%} body{background:#000}</style></head>
<body>
<div class="ok-split">
<section class="ok-stage" data-theme="camp"><span class="ok-mode">Camp · forest</span>
<div class="ok-meter"><span>Claude 5h</span><span class="ok-meter__track"><span class="ok-meter__fill" style="width:38%"></span></span><span class="ok-meter__val">38%</span></div>
<div class="ok-meter is-warn"><span>Spend</span><span class="ok-meter__track"><span class="ok-meter__fill" style="width:82%"></span></span><span class="ok-meter__val">$4.10</span></div>
<div class="ok-meter is-over"><span>Context</span><span class="ok-meter__track"><span class="ok-meter__fill" style="width:100%"></span></span><span class="ok-meter__val">131k</span></div>
<div class="ok-meter is-busy"><span>Building…</span><span class="ok-meter__track"><span class="ok-meter__fill"></span></span><span class="ok-meter__val">—</span></div>
</section>
<section class="ok-stage" data-theme="office"><span class="ok-mode">Office · VS Code</span>
<div class="ok-meter"><span>Claude 5h</span><span class="ok-meter__track"><span class="ok-meter__fill" style="width:38%"></span></span><span class="ok-meter__val">38%</span></div>
<div class="ok-meter is-warn"><span>Spend</span><span class="ok-meter__track"><span class="ok-meter__fill" style="width:82%"></span></span><span class="ok-meter__val">$4.10</span></div>
<div class="ok-meter is-over"><span>Context</span><span class="ok-meter__track"><span class="ok-meter__fill" style="width:100%"></span></span><span class="ok-meter__val">131k</span></div>
<div class="ok-meter is-busy"><span>Building…</span><span class="ok-meter__track"><span class="ok-meter__fill"></span></span><span class="ok-meter__val">—</span></div>
</section>
</div>
</body></html>
