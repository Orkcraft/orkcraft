<!doctype html>
<html><head><meta charset="utf-8"><title>Checkbox</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>html,body{margin:0;height:100%} body{background:#000}</style></head>
<body>
<div class="ok-split">
<section class="ok-stage" data-theme="camp"><span class="ok-mode">Camp · forest</span>
<label class="ok-check"><i>✓</i>The Pit → file dropped</label>
<label class="ok-check"><i></i>The Pit → link pasted</label>
<div class="ok-row"><span class="ok-chip is-on"><i class="ok-ico">🤘 </i>Punk ork</span><span class="ok-chip"><i class="ok-ico">🪓 </i>Some</span><span class="ok-chip"><i class="ok-ico">🐣 </i>New to it</span></div>
</section>
<section class="ok-stage" data-theme="office"><span class="ok-mode">Office · VS Code</span>
<label class="ok-check"><i>✓</i>The Pit → file dropped</label>
<label class="ok-check"><i></i>The Pit → link pasted</label>
<div class="ok-row"><span class="ok-chip is-on"><i class="ok-ico">🤘 </i>Punk ork</span><span class="ok-chip"><i class="ok-ico">🪓 </i>Some</span><span class="ok-chip"><i class="ok-ico">🐣 </i>New to it</span></div>
</section>
</div>
</body></html>
